spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:1245}
spring.application.name=Auth-Service
server.port=${SERVER_PORT:1251}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.auth.username=${AUTH_USERNAME:admin}
app.auth.password=${AUTH_PASSWORD:}
# Spring Boot Admin
spring.boot.admin.client.url=${ADMIN_SERVER_URL:http://localhost:1111}
spring.boot.admin.client.instance.service-host-type=ip
spring.boot.admin.client.auto-registration=true

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
services.customer-url=${CUSTOMER_URL:http://localhost:1241}

