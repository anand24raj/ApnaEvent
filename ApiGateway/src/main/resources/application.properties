spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:1245}
spring.application.name=ApiGateway
server.port=${SERVER_PORT:8080}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

spring.cloud.gateway.server.webmvc.routes[0].id=Customer-Service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/customer/**

spring.cloud.gateway.server.webmvc.routes[1].id=Venue-Service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://VENUE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/venue/**

spring.cloud.gateway.server.webmvc.routes[2].id=Event-Service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://EVENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/event/**

spring.cloud.gateway.server.webmvc.routes[3].id=Booking-Service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/booking/**

spring.cloud.gateway.server.webmvc.routes[4].id=Paymnt-Service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://PAYMNT-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/paymnt/**

spring.cloud.gateway.server.webmvc.routes[5].id=Notification-Service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/notification/**

spring.cloud.gateway.server.webmvc.routes[6].id=Auth-Service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/auth/**

springdoc.swagger-ui.urls[0].name=Customer Service
springdoc.swagger-ui.urls[0].url=/customer/v3/api-docs
springdoc.swagger-ui.urls[1].name=Venue Service
springdoc.swagger-ui.urls[1].url=/venue/v3/api-docs
springdoc.swagger-ui.urls[2].name=Event Service
springdoc.swagger-ui.urls[2].url=/event/v3/api-docs
springdoc.swagger-ui.urls[3].name=Booking Service
springdoc.swagger-ui.urls[3].url=/booking/v3/api-docs

app.jwt.secret=${JWT_SECRET}

spring.cloud.gateway.server.webmvc.routes[7].id=AdminServer
spring.cloud.gateway.server.webmvc.routes[7].uri=${ADMIN_SERVER_URL:http://localhost:1111}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/admin/**

# Browser UI routes (strip the UI prefix before forwarding to each service's static resources)
spring.cloud.gateway.server.webmvc.routes[8].id=Customer-UI
spring.cloud.gateway.server.webmvc.routes[8].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/customer-ui/**
spring.cloud.gateway.server.webmvc.routes[8].filters[0]=StripPrefix=1

