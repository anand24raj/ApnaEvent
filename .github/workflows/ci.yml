name: Maven CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: maven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        service:
          - Config-server
          - EurekaServer
          - Auth-Service
          - Customer-Service
          - Venue-Service
          - Event-Service
          - Paymnt-Service
          - Booking-Service
          - Notification-Service
          - RA-AI-Service
          - AdminServer
          - ApiGateway

    # These values are disposable CI-only credentials, never production secrets.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-only-mysql-password
      JWT_SECRET: ci-only-jwt-secret-change-for-real-deployments-2026
      AUTH_USERNAME: admin
      AUTH_PASSWORD: CI-only-Admin-Password-123!

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-mysql-password
          MYSQL_DATABASE: auth_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-mysql-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B --no-transfer-progress clean verify
