
name: Maven CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        service:
          - Config-server
          - EurekaServer
          - Auth-Service
          - Customer-Service
          - Venue-Service
          - Event-Service
          - Paymnt-Service
          - Booking-Service
          - Notification-Service
          - RA-AI-Service
          - AdminServer
          - ApiGateway

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package
