<div class="top"><div class="title"><h1>Add venue</h1><p>Save this record to the live Venue Service database.</p></div></div><div class="card"><form class="form" id="recordForm"><div class="field"><label for="venueName">Venue name</label><input id="venueName" required></div><div class="field"><label for="city">City</label><input id="city" required></div><div class="field"><label for="capacity">Capacity</label><input id="capacity" type="number" min="1" required></div><div class="field"><label for="venueType">Venue type</label><select id="venueType"><option>HALL</option><option>AUDITORIUM</option><option>HOTEL</option><option>RESTAURANT</option></select></div><div class="field"><label for="facilities">Facilities</label><select id="facilities"><option>PARKING</option><option>WIFI</option><option>AC</option><option>SECURITY</option></select></div><div class="field"><label for="status">Status</label><select id="status"><option>ACTIVE</option><option>PENDING</option><option>COMPLETED</option></select></div><div class="full actions"><button class="btn" id="saveButton" type="submit">Save venue</button><a class="btn secondary" href="list.html">Cancel</a></div><p id="formMessage" class="muted"></p></form></div>
