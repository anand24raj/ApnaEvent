spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:1245}
spring.application.name=Venue-Service
server.port=${SERVER_PORT:1236}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:venue_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.pattern.level=%5p [corr:%X{correlationId:-}]
# Spring Boot Admin
spring.boot.admin.client.url=${ADMIN_SERVER_URL:http://localhost:1111}
spring.boot.admin.client.instance.service-host-type=ip
spring.boot.admin.client.auto-registration=true

