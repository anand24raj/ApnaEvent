spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:1245}
spring.application.name=Paymnt-Service
server.port=${SERVER_PORT:1239}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:payment_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Resilience4j
resilience4j.circuitbreaker.instances.venueService.sliding-window-size=10
resilience4j.circuitbreaker.instances.venueService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.venueService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bookingService.sliding-window-size=10
resilience4j.circuitbreaker.instances.bookingService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookingService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s
resilience4j.retry.instances.paymentService.max-attempts=3
resilience4j.retry.instances.paymentService.wait-duration=500ms
resilience4j.timelimiter.instances.paymentService.timeout-duration=3s

logging.pattern.level=%5p [corr:%X{correlationId:-}]

# Spring Boot Admin
spring.boot.admin.client.url=${ADMIN_SERVER_URL:http://localhost:1111}
spring.boot.admin.client.instance.service-host-type=ip
spring.boot.admin.client.auto-registration=true

