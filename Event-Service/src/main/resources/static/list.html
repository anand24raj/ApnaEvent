
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Events</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/ra-assistant.css">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <meta name="description" content="Events on ApnaEvent. Discover and manage events, venues, bookings, and account information using the ApnaEvent platform.">
  <meta property="og:title" content="Events | ApnaEvent">
  <meta property="og:description" content="Events on ApnaEvent. Discover and manage events, venues, bookings, and account information using the ApnaEvent platform.">
  <meta property="og:type" content="website">
</head>
<body>


	<div id="appShell"></div>
	<main class="main">
		>

		<div class="top">
			<div class="title">
				<h1>Events</h1>
				<p>Live records from the Event Service database.</p>
			</div>
			<a class="btn" href="form.html">+ New event</a>
		</div>
		<div class="card">
			<div class="actions">
				<input class="search" id="search" placeholder="Search records">
			</div>
			<div class="table-wrap">
				<table class="table">
					<thead>
						<tr>
							<th>Event</th>
							<th>Date</th>
							<th>Venue</th>
							<th>Seats</th>
							<th>Price</th>
							<th>Status</th>
							<th>Action</th>
						</tr>
					</thead>
					<tbody id="rows">
						<tr>
							<td colspan="7" class="empty">Loading…</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</main>

	<script src="assets/app.js"></script>
	<script src="assets/app-shell.js"></script>
	<script src="assets/page.js"></script>
	<script src="assets/ra-assistant.js"></script>
</body>
</html>
