<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create event</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/ra-assistant.css">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <meta name="description" content="Create event on ApnaEvent. Discover and manage events, venues, bookings, and account information using the ApnaEvent platform.">
  <meta property="og:title" content="Create event | ApnaEvent">
  <meta property="og:description" content="Create event on ApnaEvent. Discover and manage events, venues, bookings, and account information using the ApnaEvent platform.">
  <meta property="og:type" content="website">
</head>
<body>
	

<div id="appShell"></div>
<main class="main">>

<div class="top">
				<div class="title">
					<h1>Create event</h1>
					<p>Save this record to the live Event Service database.</p>
				</div>
			</div>
			<div class="card">
				<form class="form" id="recordForm">
					<div class="field">
						<label for="eventName">Event name</label><input id="eventName"
							required>
					</div>
					<div class="field">
						<label for="eventCategory">Category</label><input
							id="eventCategory" required>
					</div>
					<div class="field">
						<label for="eventDate">Date</label><input id="eventDate"
							type="date" required>
					</div>
					<div class="field">
						<label for="eventTime">Time</label><input id="eventTime"
							type="time" required>
					</div>
					<div class="field">
						<label for="venueId">Venue ID</label><select id="venueId" required><option
								value="">Loading venues…</option></select>
					</div>
					<div class="field">
						<label for="totalSeats">Total seats</label><input id="totalSeats"
							type="number" min="1" required>
					</div>
					<div class="field">
						<label for="ticketPrice">Ticket price</label><input
							id="ticketPrice" type="number" min="0" step="0.01" required>
					</div>
					<div class="full actions">
						<button class="btn" id="saveButton" type="submit">Save
							event</button>
						<a class="btn secondary" href="list.html">Cancel</a>
					</div>
					<p id="formMessage" class="muted"></p>
				</form>
			</div>

</main>

    
    
    
    
<script src="assets/app.js"></script>
<script src="assets/app-shell.js"></script>
<script src="assets/page.js"></script>
<script src="assets/ra-assistant.js"></script>
</body>
</html>
